name: Build and publish Docker images

on:
  workflow_call:
    inputs:
      registry-host:
        required: true
        type: string
      images:
        required: true
        type: string
      commit-sha:
        required: true
        type: string
      global-build-args-json:
        required: false
        type: string
        default: '{}'
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
    outputs:
      image-repositories-json:
        description: Expected image repositories
        value: ${{ jobs.plan.outputs.image_repositories_json }}
      image-references-json:
        description: Expected image references with SHA tag
        value: ${{ jobs.plan.outputs.image_references_json }}
      image-tag:
        description: Published image tag
        value: ${{ inputs.commit-sha }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      image_repositories_json: ${{ steps.plan.outputs.image_repositories_json }}
      image_references_json: ${{ steps.plan.outputs.image_references_json }}
    steps:
      - name: Validate image matrix and build plan
        id: plan
        env:
          IMAGES_JSON: ${{ inputs.images }}
          GLOBAL_BUILD_ARGS_JSON: ${{ inputs.global-build-args-json }}
          REGISTRY_HOST: ${{ inputs.registry-host }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          set -euo pipefail

          if ! jq -e 'type == "array"' >/dev/null <<<"$IMAGES_JSON"; then
            echo "images input must be a JSON array" >&2
            exit 1
          fi

          if ! jq -e 'type == "object"' >/dev/null <<<"$GLOBAL_BUILD_ARGS_JSON"; then
            echo "global-build-args-json must be a JSON object" >&2
            exit 1
          fi

          owner="${REPOSITORY%%/*}"
          repo="${REPOSITORY##*/}"
          owner="$(echo "$owner" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')"
          repo="$(echo "$repo" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')"

          matrix=$(jq -c \
            --arg registry "$REGISTRY_HOST" \
            --arg owner "$owner" \
            --arg repo "$repo" \
            --argjson global_args "$GLOBAL_BUILD_ARGS_JSON" \
            '
              map(
                if (.context|type != "string") or (.dockerfile|type != "string") then
                  error("Each image needs string context and dockerfile")
                else . end
                | .suffix = (.suffix // "")
                | if (.suffix|test("^(-[a-z0-9]+([._-][a-z0-9]+)*)?$")|not) then
                    error("Invalid suffix: \(.suffix)")
                  else . end
                | if ((.context|startswith("/") or contains("../"))) then
                    error("Invalid context path")
                  else . end
                | if ((.dockerfile|startswith("/") or contains("../"))) then
                    error("Invalid dockerfile path")
                  else . end
                | .target = (.target // "")
                | .build_args = ($global_args + (.build_args // {}))
                | .artifact_name = (.artifact_name // "")
                | .artifact_path = (.artifact_path // "")
                | if (.artifact_path != "" and (.artifact_path|startswith("/") or contains("../"))) then
                    error("Invalid artifact_path")
                  else . end
                | .image_repository = ($registry + "/" + $owner + "/" + $repo + .suffix)
                | .image_reference = (.image_repository + ":" + $ENV.COMMIT_SHA)
              )
            ' <<<"$IMAGES_JSON")

          repos=$(jq -c 'map(.image_repository)' <<<"$matrix")
          refs=$(jq -c 'map(.image_reference)' <<<"$matrix")

          {
            echo "matrix=$matrix"
            echo "image_repositories_json=$repos"
            echo "image_references_json=$refs"
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry-host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Download prepared artifacts
        if: ${{ matrix.image.artifact_name != '' }}
        uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ matrix.image.artifact_name }}
          path: ${{ matrix.image.context }}/${{ matrix.image.artifact_path }}

      - name: Verify build inputs
        run: |
          set -euo pipefail
          test -d "${{ matrix.image.context }}"
          test -f "${{ matrix.image.dockerfile }}"

      - name: Build metadata
        id: meta
        env:
          BUILD_ARGS_JSON: ${{ toJson(matrix.image.build_args) }}
        run: |
          set -euo pipefail
          if ! jq -e 'type == "object"' >/dev/null <<<"$BUILD_ARGS_JSON"; then
            echo "build_args must be an object" >&2
            exit 1
          fi
          {
            echo "build_args<<EOF"
            jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$BUILD_ARGS_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: true
          tags: ${{ matrix.image.image_reference }}
          build-args: ${{ steps.meta.outputs.build_args }}
